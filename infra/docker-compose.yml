# Local development services. Start with `pnpm db:up`.
name: hopback

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hopback
      POSTGRES_PASSWORD: hopback
      POSTGRES_DB: hopback
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hopback -d hopback']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
